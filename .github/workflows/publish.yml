name: Publish Packages

# Solo a mano (pestaña Actions → Publish Packages → Run workflow).
#
# Se ejecutaba en cada push a main y fallaba siempre con 403 write_package: el
# GITHUB_TOKEN de este repo no tiene permiso de escritura sobre los paquetes
# @orkoruta. Hoy ningún consumidor los baja del registro (backend y frontend
# usan packages-ruta por `link:`) y la publicación se hace a mano con un PAT
# (ver CLAUDE.md §10). En push solo pintaba de rojo cada commit.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@orkoruta'

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NPM_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ruta

      - name: Publish
        run: pnpm publish:packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
